[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "packsmith"
version = "0.1.0"
description = "Content-addressed dataset packages with verified resumable restore"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
packsmith = "packsmith.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
